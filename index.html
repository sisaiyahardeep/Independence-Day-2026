<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🇮🇳 स्वतंत्रता दिवस की शुभकामनाएँ</title>

    <meta name="twitter:title" content="एक विशेष संदेश आपके लिए! 🇮🇳">
    <meta name="twitter:description" content="Happy Independence Day 🇮🇳

आइए इस स्वतंत्रता दिवस पर एक बेहतर भारत के निर्माण में अपना योगदान देने का संकल्प लें।

    <meta name="twitter:image" content="15August.png">
    <meta name="description" content="स्वतंत्रता दिवस की हार्दिक शुभकामनाएँ! अपना व्यक्तिगत संदेश बनाएं।">
    
    <!-- Tailwind CSS for layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-900 text-white min-h-screen overflow-x-hidden relative font-sans selection:bg-orange-500 selection:text-white">
    <!-- Background gradients -->
    <div class="fixed inset-0 bg-gradient-to-b from-orange-500/10 via-transparent to-green-600/10 pointer-events-none z-0"></div>
    <div class="fixed top-[-20%] left-[-10%] w-[50%] h-[50%] rounded-full bg-orange-500/15 blur-[120px] pointer-events-none z-0"></div>
    <div class="fixed bottom-[-20%] right-[-10%] w-[50%] h-[50%] rounded-full bg-green-600/15 blur-[120px] pointer-events-none z-0"></div>

    <!-- Balloons Container -->
    <div id="balloons-container" class="fixed inset-0 pointer-events-none z-10 overflow-hidden"></div>

    <!-- Massive Waving Background Flag -->
    <div class="fixed inset-0 flex items-center justify-center pointer-events-none z-0 overflow-hidden opacity-[0.25] mix-blend-screen">
        <div class="big-css-flag">
            <svg class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[18vw] h-[18vw] max-w-[120px] max-h-[120px]" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="none" stroke="#000080" stroke-width="4"/>
                <circle cx="50" cy="50" r="8" fill="#000080"/>
                <g stroke="#000080" stroke-width="1.5">
                    <line x1="50" y1="5" x2="50" y2="95"/>
                    <line x1="5" y1="50" x2="95" y2="50"/>
                    <line x1="18" y1="18" x2="82" y2="82"/>
                    <line x1="18" y1="82" x2="82" y2="18"/>
                    <line x1="32" y1="8" x2="68" y2="92"/>
                    <line x1="68" y1="8" x2="32" y2="92"/>
                    <line x1="8" y1="32" x2="92" y2="68"/>
                    <line x1="8" y1="68" x2="92" y2="32"/>
                    <line x1="24" y1="12" x2="76" y2="88"/>
                    <line x1="76" y1="12" x2="24" y2="88"/>
                    <line x1="12" y1="24" x2="88" y2="76"/>
                    <line x1="12" y1="76" x2="88" y2="24"/>
                </g>
            </svg>
        </div>
    </div>
    
    <!-- Rafale Flyover -->
    <div id="rafale-container" class="rafale-container hidden">
        <img src="./rafale.png" alt="Rafale Jet" class="w-48 md:w-72 object-contain drop-shadow-2xl">
        <div class="smoke-trail">
            <div class="smoke smoke-orange"></div>
            <div class="smoke smoke-white"></div>
            <div class="smoke smoke-green"></div>
        </div>
    </div>

    <!-- Waving Flags at Top -->
    <div class="fixed top-4 left-4 z-30 waving-flag">🇮🇳</div>
    <div class="fixed top-4 right-4 z-30 waving-flag transform scale-x-[-1]">🇮🇳</div>

    <audio id="bg-audio" loop playsinline></audio>

    <!-- Main Content -->
    <main class="relative z-20 flex flex-col items-center min-h-screen pb-24 max-w-lg mx-auto w-full px-3 pt-6 md:pt-10">
        
        <!-- Hero Image Card -->
        <div class="w-full relative rounded-3xl overflow-hidden shadow-[0_0_40px_rgba(255,153,51,0.2)] ring-1 ring-white/10 mb-5 sm:mb-8 transform hover:scale-[1.02] transition-transform duration-500">
            <div class="aspect-video sm:aspect-[4/3] w-full relative group">
                <img src="./banner.webp" alt="Independence Day Banner" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" >
                <div class="absolute inset-0 bg-gradient-to-t from-gray-900 via-gray-900/40 to-transparent"></div>
                <div class="absolute -bottom-2 left-0 right-0 text-center px-4 pb-2">
                    <h1 class="text-2xl md:text-4xl font-black tracking-tight drop-shadow-[0_4px_8px_rgba(0,0,0,0.8)] leading-tight">
                        <span class="text-orange-400 block mb-0 sm:mb-1">Happy</span>
                        <span class="text-white block mb-0 sm:mb-1">Independence Day</span>
                        <span class="text-green-500 block">2026</span>
                    </h1>
                </div>
            </div>
        </div>

        <!-- Greeting Card (Hidden by default, shown when URL params exist or generated) -->
        <div id="greeting-card" class="w-full relative hidden mb-8">
            <div class="absolute -inset-1 bg-gradient-to-r from-orange-500 via-white to-green-600 rounded-2xl blur opacity-30 animate-pulse"></div>
            <div class="relative w-full rounded-2xl glass-card p-5 sm:p-8 text-center overflow-hidden border border-white/20">
                <div class="absolute top-[-20px] right-[-20px] text-8xl opacity-10 rotate-12 select-none">🇮🇳</div>
                
                <div class="mb-8">
                    <div class="flex items-center justify-center gap-2 mb-4">
                        <span class="text-2xl animate-bounce">🇮🇳</span>
                        <span class="text-gray-300 font-medium">एक खास संदेश</span>
                        <span class="text-2xl animate-bounce delay-100">🇮🇳</span>
                    </div>
                    
                    <h2 class="text-2xl font-bold mb-2">
                        <span id="sender-name" class="text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-orange-200 font-black text-3xl drop-shadow-md"></span> 
                        <span class="text-white/90 text-xl block mt-2">की तरफ से आपके लिए</span>
                    </h2>
                </div>

                <div class="my-6">
                    <div class="text-3xl sm:text-4xl font-black bg-gradient-to-r from-orange-400 via-white to-green-500 text-transparent bg-clip-text drop-shadow-lg leading-tight">
                        स्वतंत्रता दिवस की शुभकामनाएँ
                    </div>
                </div>
                
                <div class="flex items-start sm:items-center justify-center gap-2 sm:gap-6 my-6">
                    <div class="waving-flag text-4xl sm:text-5xl flex-shrink-0 mt-2 sm:mt-0 select-none">🇮🇳</div>
                    <p id="greeting-message" class="text-base sm:text-xl font-medium leading-relaxed text-white/90 drop-shadow-md italic relative px-4 flex-1">
                        <span class="absolute -top-4 left-0 text-4xl text-orange-500/30">"</span>
                        <span id="greeting-text"></span>
                        <span class="absolute -bottom-4 right-0 text-4xl text-green-500/30">"</span>
                    </p>
                    <div class="waving-flag text-4xl sm:text-5xl flex-shrink-0 mt-2 sm:mt-0 select-none">🇮🇳</div>
                </div>
            </div>
        </div>

        <!-- Input Section -->
        <div id="input-section" class="w-full flex flex-col gap-4">
            <div class="glass-card p-6 rounded-2xl border border-white/10 shadow-2xl relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-orange-500 via-white to-green-600"></div>
                <h3 class="text-center font-semibold text-lg mb-4 text-white/90">अपना खुद का शुभकामना संदेश बनाएं 🇮🇳</h3>
                <input type="text" id="name-input" placeholder="यहाँ अपना नाम लिखें..." maxlength="40" class="w-full bg-black/40 border border-white/20 rounded-xl px-5 py-4 text-white placeholder:text-white/50 focus:outline-none focus:ring-2 focus:ring-orange-500 transition-all text-lg text-center mb-4">
                <button id="generate-btn" class="relative w-full rounded-xl bg-gradient-to-r from-orange-500 to-orange-400 px-6 py-4 font-bold text-white shadow-[0_0_20px_rgba(249,115,22,0.3)] transition-transform hover:scale-[1.02] active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                    <div class="flex items-center justify-center gap-2 text-lg">
                        <span class="text-xl">✨</span> संदेश बनाएं
                    </div>
                </button>
            </div>
        </div>

        <!-- Action Buttons (Shown after generation) -->
        <div id="action-buttons" class="w-full flex flex-col gap-4 hidden mt-4">
            <button id="share-btn" class="group relative w-full overflow-hidden rounded-xl bg-[#25D366] px-6 py-4 font-bold text-white shadow-[0_0_20px_rgba(37,211,102,0.4)] transition-transform hover:scale-[1.02] active:scale-95">
                <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out"></div>
                <div class="relative flex items-center justify-center gap-3 text-lg">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                    WhatsApp पर शेयर करें
                </div>
            </button>
            <button id="create-new-btn" class="relative overflow-hidden w-full rounded-xl bg-white/10 border border-white/20 px-6 py-4 font-bold text-white transition-all hover:bg-white/20 active:scale-95">
                अपना नया संदेश बनाएं
            </button>
        </div>

    
        <!-- Footer -->
        <div class="mt-8 mb-4 w-full text-center">
            <a href="https://www.instagram.com/officialhardeepsisaiya" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center gap-2 px-6 py-3 glass-card hover:scale-105 active:scale-95 transition-all duration-300 group text-white/90 no-underline">
                <span class="font-medium text-sm md:text-base">Made with</span>
                <span class="text-red-500 animate-pulse text-lg">❤️</span>
                <span class="font-medium text-sm md:text-base">by <span class="font-bold text-transparent bg-clip-text bg-gradient-to-r from-orange-400 via-white to-green-500">Hardeep Sisaiya</span></span>
                <svg class="w-4 h-4 opacity-70 group-hover:opacity-100 transition-opacity" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
            </a>
        </div>

    </main>

    <!-- Scripts -->
    <!-- Confetti Script from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
